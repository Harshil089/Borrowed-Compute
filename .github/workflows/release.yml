name: release

# On every merge to main, releases whichever app changed. The Mac app (agent) and the
# Windows app (client) are versioned separately: `.github/release-plan.sh` compares the
# push with each app's last tag in this repo (agent-v0.2.3, client-v0.2.7) and picks the
# next version. Each app is built, its update signed, and published to the public
# releases repo as its own release (agent-v…, client-v…), and this repo is tagged.
#
# The apps' Check for updates reads `agent.json` and `client.json` from the releases
# repo's latest release, so every release carries both: the new one for the app it ships,
# and the other app's current one, copied from the previous latest release.
#
# Secrets:
# - TAURI_SIGNING_PRIVATE_KEY: signs updates; the apps only install updates signed by it.
#   Its public half is `plugins.updater.pubkey` in both apps' tauri.conf.json.
# - RELEASES_TOKEN: fine-grained token with Contents read and write on the releases repo.
# - GOOGLE_CLIENT_SECRET: optional; the Google OAuth client's secret for Google sign-in.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: Which apps to release (auto releases what changed)
        type: choice
        options: [auto, both, agent, client]
        default: auto

permissions:
  # Tags each release in this repo, so the next push knows what changed since.
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: Harshil089/Borrowed-Compute-releases
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
  # Only release builds make update packages, so local builds need no signing key.
  UPDATER_CONFIG: '{"bundle":{"createUpdaterArtifacts":true}}'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.plan.outputs.agent }}
      agent_version: ${{ steps.plan.outputs.agent_version }}
      client: ${{ steps.plan.outputs.client }}
      client_version: ${{ steps.plan.outputs.client_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what to release
        id: plan
        run: |
          sh .github/release-plan.sh "${{ inputs.apps || 'auto' }}" | tee -a "$GITHUB_OUTPUT"

  mac:
    needs: plan
    if: needs.plan.outputs.agent == 'true'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.plan.outputs.agent_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (matches rust-toolchain.toml)
        run: rustup toolchain install 1.91 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version
        run: node .github/set-version.mjs apps/bc-desktop-agent/tauri.conf.json "$VERSION"

      # CI=true skips the bundler's Finder AppleScript styling of the dmg, which needs a
      # logged-in desktop.
      #
      # On GitHub's macOS runners `hdiutil create` sometimes fails with "Resource busy",
      # usually because a disk image from an earlier attempt is still attached. Retry up to
      # three times, detaching stale images and removing the half-written dmg in between.
      # Compiled code is cached, so a retry repeats only the bundling.
      - name: Build Borrowed Compute Agent
        working-directory: apps/bc-desktop-agent
        env:
          CI: "true"
          # Built into the Mac app's cloud for Google sign-in; empty hides the button.
          BC_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for attempt in 1 2 3; do
            if npx --yes @tauri-apps/cli@2.12.4 build --bundles app,dmg --config "$UPDATER_CONFIG"; then
              exit 0
            fi
            echo "::warning::Bundling failed on attempt $attempt; detaching disk images and retrying"
            hdiutil info | awk '/^\/dev\/disk/ { print $1 }' | while read -r disk; do
              hdiutil detach -force "$disk" || true
            done
            rm -f ../../target/release/bundle/dmg/*.dmg
            sleep 15
          done
          echo "::error::Bundling failed three times"
          exit 1

      - name: Collect
        run: |
          mkdir dist
          cp "target/release/bundle/macos/Borrowed Compute Agent.app.tar.gz" dist/BorrowedComputeAgent.app.tar.gz
          cp "target/release/bundle/macos/Borrowed Compute Agent.app.tar.gz.sig" dist/BorrowedComputeAgent.app.tar.gz.sig
          cp target/release/bundle/dmg/*.dmg dist/BorrowedComputeAgent.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*
          if-no-files-found: error

  windows:
    needs: plan
    if: needs.plan.outputs.client == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.client_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (matches rust-toolchain.toml)
        run: rustup toolchain install 1.91 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version
        shell: bash
        run: node .github/set-version.mjs apps/bc-desktop/tauri.conf.json "$VERSION"

      - name: Build Borrowed Compute
        working-directory: apps/bc-desktop
        shell: bash
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis --config "$UPDATER_CONFIG"

      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*-setup.exe dist/BorrowedCompute-setup.exe
          cp target/release/bundle/nsis/*-setup.exe.sig dist/BorrowedCompute-setup.exe.sig

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, mac, windows]
    # Runs when at least one app was built and nothing failed; a skipped app is fine.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.plan.outputs.agent == 'true' || needs.plan.outputs.client == 'true')
    runs-on: ubuntu-latest
    env:
      AGENT: ${{ needs.plan.outputs.agent }}
      AGENT_VERSION: ${{ needs.plan.outputs.agent_version }}
      CLIENT: ${{ needs.plan.outputs.client }}
      CLIENT_VERSION: ${{ needs.plan.outputs.client_version }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A new manifest for each app built; the other app's current one is carried over.
      - name: Write update manifests
        run: |
          latest="https://github.com/$RELEASES_REPO/releases/latest/download"
          if [ "$AGENT" = true ]; then
            node .github/update-manifest.mjs "$AGENT_VERSION" darwin-aarch64 \
              "https://github.com/$RELEASES_REPO/releases/download/agent-v$AGENT_VERSION/BorrowedComputeAgent.app.tar.gz" \
              dist/BorrowedComputeAgent.app.tar.gz.sig > dist/agent.json
          else
            curl -fsSL "$latest/agent.json" -o dist/agent.json
          fi
          if [ "$CLIENT" = true ]; then
            node .github/update-manifest.mjs "$CLIENT_VERSION" windows-x86_64 \
              "https://github.com/$RELEASES_REPO/releases/download/client-v$CLIENT_VERSION/BorrowedCompute-setup.exe" \
              dist/BorrowedCompute-setup.exe.sig > dist/client.json
          else
            curl -fsSL "$latest/client.json" -o dist/client.json
          fi
          cat dist/agent.json dist/client.json

      # The client goes last when both ship, so the newest release (the one Check for
      # updates reads) holds both new manifests.
      - name: Publish releases
        run: |
          short=${GITHUB_SHA::7}
          if [ "$AGENT" = true ]; then
            gh release create "agent-v$AGENT_VERSION" --repo "$RELEASES_REPO" \
              --title "Borrowed Compute Agent $AGENT_VERSION (Mac)" \
              --notes "Mac app, built from $short. Install BorrowedComputeAgent.dmg; installed apps update themselves." \
              dist/BorrowedComputeAgent.dmg dist/BorrowedComputeAgent.app.tar.gz dist/agent.json dist/client.json
          fi
          if [ "$CLIENT" = true ]; then
            gh release create "client-v$CLIENT_VERSION" --repo "$RELEASES_REPO" \
              --title "Borrowed Compute $CLIENT_VERSION (Windows)" \
              --notes "Windows app, built from $short. Install BorrowedCompute-setup.exe; installed apps update themselves." \
              dist/BorrowedCompute-setup.exe dist/agent.json dist/client.json
          fi

      - name: Tag this repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$AGENT" = true ]; then git tag "agent-v$AGENT_VERSION"; fi
          if [ "$CLIENT" = true ]; then git tag "client-v$CLIENT_VERSION"; fi
          git push origin --tags
