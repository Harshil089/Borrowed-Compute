<main id="main">
  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow reveal">Changelog</p>
      <h1 class="display reveal d1">What's new</h1>
      <p class="lede reveal d2">Every release, for Mac and for Windows, newest first. The app updates itself, so there is nothing to download again.</p>
      <div class="segmented reveal d3" role="group" aria-label="Show releases for">
        <span class="seg-pill" aria-hidden="true"></span>
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="agent" aria-pressed="false">Mac</button>
        <button type="button" data-filter="client" aria-pressed="false">Windows</button>
      </div>
    </div>
  </section>
  <section class="section tight">
    <div class="wrap">
      <ol class="timeline" id="timeline" aria-live="polite">
        <li class="timeline-empty"><span class="dot live"></span>Loading releases…</li>
      </ol>
    </div>
  </section>
</main>
