[package]
name = "bc-infer"
description = "Borrowed Compute's inference engine: quantized transformers run a layer range at a time, weights read by byte range into memory."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"

# Loaded when the program starts, not linked: PCs without an NVIDIA driver run on the CPU.
[target.'cfg(not(target_os = "macos"))'.dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12000", "std"] }

[dev-dependencies]
sha2.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
