[package]
name = "bc-desktop-agent"
description = "Borrowed Compute Agent: the Mac menu-bar app that runs jobs from paired devices."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
iroh-relay = { workspace = true, features = ["server"] }
bc-agent.workspace = true
bc-cloud.workspace = true
bc-auth.workspace = true
bc-net.workspace = true
bc-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
humantime.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "time", "process", "io-util", "net"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tempfile.workspace = true
