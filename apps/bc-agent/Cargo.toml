[package]
name = "bc-agent"
description = "Mac agent: accepts jobs from paired devices and runs them."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bc-proto.workspace = true
bc-net.workspace = true
bc-auth.workspace = true
serde_json.workspace = true
serde.workspace = true
iroh.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "fs"] }
tar.workspace = true
tempfile.workspace = true
libc.workspace = true
clap.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
