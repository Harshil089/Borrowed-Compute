[workspace]
resolver = "2"
members = [
    "crates/bc-proto",
    "crates/bc-net",
    "apps/bc-agent",
    "apps/bc-cli",
    "apps/bc-cloud",
    "crates/bc-auth",
    "apps/bc-desktop",
    "apps/bc-desktop-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bc-proto = { path = "crates/bc-proto" }
bc-net = { path = "crates/bc-net" }
bc-auth = { path = "crates/bc-auth" }
bc-agent = { path = "apps/bc-agent" }
bc-cli = { path = "apps/bc-cli" }
bc-cloud = { path = "apps/bc-cloud" }

serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
toml = "0.8"
thiserror = "1"
humantime = "2"
anyhow = "1"
tokio = "1"
iroh = "1.4.1"
iroh-relay = { version = "1.4.1", default-features = false }
dirs = "6"
tar = "0.4"
tempfile = "3"
libc = "0.2"
ignore = "0.4"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
iroh-base = { version = "1.4.1", features = ["key"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "any", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"

# On macOS 27, stripping proc-macro dylibs leaves them unloadable ("mis-aligned LINKEDIT
# string pool"), which breaks every release build. Only build-time code is affected; the
# shipped binaries are still stripped.
[profile.release.build-override]
strip = false
