[workspace]
resolver = "2"
members = [
    "crates/bc-proto",
    "crates/bc-net",
    "apps/bc-agent",
    "apps/bc-cli",
    "apps/bc-cloud",
    "crates/bc-auth",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bc-proto = { path = "crates/bc-proto" }
bc-net = { path = "crates/bc-net" }
bc-auth = { path = "crates/bc-auth" }

serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
toml = "0.8"
thiserror = "1"
humantime = "2"
anyhow = "1"
tokio = "1"
iroh = "1.4.1"
iroh-relay = { version = "1.4.1", default-features = false }
dirs = "6"
tar = "0.4"
tempfile = "3"
libc = "0.2"
ignore = "0.4"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
iroh-base = { version = "1.4.1", features = ["key"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "json", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
